# Publie automatiquement la version démo du jeu sur GitHub Pages à chaque envoi sur la branche main.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site/lib
          cp -r public/. _site/
          cp lib/demo.js lib/moteur.js _site/lib/
          cp -r lib/affaires _site/lib/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
